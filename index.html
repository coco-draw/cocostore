<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>COCO STORE</title>
<link rel="stylesheet" href="style.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<!-- HOME / GRID -->
<div class="page active" id="home">

    <img src="images/banner.jpg" class="banner">

    <h2>COCO STORE</h2>

    <div class="grid">

        <img src="images/product1.jpg"
             onclick="openProduct('images/black.jpg','COCO BAG')">

        <img src="images/product2.jpg"
             onclick="openProduct('images/product2.jpg','COCO SHOES')">

        <img src="images/product3.jpg"
             onclick="openProduct('images/product3.jpg','COCO WATCH')">

        <img src="images/product4.jpg"
             onclick="openProduct('images/product4.jpg','COCO GLASSES')">

    </div>

</div>

<!-- DETAIL PAGE -->
<div class="page detail-page" id="detail">

    <div class="detail-card">

        <img id="mainImg" class="detail-img">

        <p id="title"></p>

        <!-- VARIANT -->
        <div class="colors">

            <button onclick="changeImg('images/black.jpg')">Black</button>
            <button onclick="changeImg('images/purple.jpg')">Purple</button>
            <button onclick="changeImg('images/gold.jpg')">Gold</button>
            <button onclick="changeImg('images/silver.jpg')">Silver</button>

        </div>

        <a class="back" onclick="closeProduct()">← BACK</a>

        <a class="buy"
           href="https://shopee.co.id/cocodraw?categoryId=100535&entryPoint=ShopByPDP&itemId=48709530040"
           target="_blank">
           BUY ON SHOPEE
        </a>

    </div>

</div>

<!-- WHATSAPP FLOAT -->
<a class="wa"
   href="https://api.whatsapp.com/send/?phone=6285363892602&text&type=phone_number&app_absent=0"
   target="_blank">
💬
</a>

<script>
function openProduct(img,title){
    document.getElementById("mainImg").src = img;
    document.getElementById("title").innerText = title;

    document.getElementById("detail").classList.add("show");
}

function closeProduct(){
    document.getElementById("detail").classList.remove("show");
}

function changeImg(img){
    document.getElementById("mainImg").src = img;
}
</script>

</body>
</html>
