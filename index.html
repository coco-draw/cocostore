<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>COCO STORE</title>
<link rel="stylesheet" href="style.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<!-- ================= HOME ================= -->
<div id="home">

    <img src="images/banner.jpg" class="banner">

    <!-- AREA KLIK DI DALAM BANNER -->
    <div class="click-area" onclick="openProduct('bag')"></div>

</div>

<!-- ================= PRODUCT PAGE ================= -->
<div id="productPage" class="page hidden">

    <!-- UI DESAIN (SUDAH ADA BACK DI DALAM GAMBAR) -->
    <div class="ui-wrapper">

        <img src="images/ui-product.png" class="ui">

        <!-- BACK (HOTSPOT DI ATAS TEKS BACK DI DESAIN) -->
        <div class="back-area" onclick="goHome()"></div>

        <!-- AREA GAMBAR PRODUK -->
        <img id="mainImg" class="big">

    </div>

    <!-- VARIAN WARNA -->
    <div class="colors">

        <button onclick="setColor('black')">Black</button>
        <button onclick="setColor('purple')">Purple</button>
        <button onclick="setColor('gold')">Gold</button>
        <button onclick="setColor('silver')">Silver</button>

    </div>

    <!-- BUY -->
    <a class="buy"
       href="https://shopee.co.id/cocodraw?categoryId=100535&entryPoint=ShopByPDP&itemId=48709530040"
       target="_blank">
       BUY ON SHOPEE
    </a>

</div>

<!-- WA -->
<a class="wa"
   href="https://api.whatsapp.com/send/?phone=6285363892602&text&type=phone_number&app_absent=0"
   target="_blank">
💬
</a>

<script>

function openProduct(product){

    document.getElementById("home").style.display = "none";
    document.getElementById("productPage").classList.remove("hidden");

    document.getElementById("mainImg").src = "images/black.jpg";
}

function goHome(){
    document.getElementById("productPage").classList.add("hidden");
    document.getElementById("home").style.display = "block";
}

function setColor(color){
    document.getElementById("mainImg").src = "images/" + color + ".jpg";
}

</script>

</body>
</html>
