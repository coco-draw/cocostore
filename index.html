<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>COCO STORE</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ================= HOME ================= -->
<div id="home">

  <div class="banner-wrapper">

    <img src="images/banner.jpg" class="banner">

    <!-- 5 PRODUCT -->
    <div class="hot p1" onclick="openProduct(1)"></div>
    <div class="hot p2" onclick="openProduct(2)"></div>
    <div class="hot p3" onclick="openProduct(3)"></div>
    <div class="hot p4" onclick="openProduct(4)"></div>
    <div class="hot p5" onclick="openProduct(5)"></div>

    <!-- VARIANT -->
    <div class="hot variant" onclick="openVariant()"></div>

    <!-- CART -->
    <a class="hot cart"
       href="https://shopee.co.id/cocodraw?categoryId=100535&entryPoint=ShopByPDP&itemId=48709530040"
       target="_blank"></a>

    <!-- WA -->
    <a class="hot wa"
       href="https://api.whatsapp.com/send/?phone=6285363892602&text&type=phone_number&app_absent=0"
       target="_blank"></a>

  </div>

</div>

<!-- ================= PRODUCT PAGE ================= -->
<div id="product" class="hidden">

  <button class="back" onclick="goHome()">← BACK</button>

  <img id="mainImg" class="big">

  <div class="colors">
    <button onclick="setColor('black')">Black</button>
    <button onclick="setColor('purple')">Purple</button>
    <button onclick="setColor('gold')">Gold</button>
    <button onclick="setColor('silver')">Silver</button>
  </div>

</div>

<script>

let currentProduct = 1;

function openProduct(id){

    currentProduct = id;

    document.getElementById("home").style.display = "none";
    document.getElementById("product").classList.remove("hidden");

    // otomatis ambil product1 - product5
    document.getElementById("mainImg").src = "images/product" + id + ".jpg";
}

function openVariant(){

    document.getElementById("home").style.display = "none";
    document.getElementById("product").classList.remove("hidden");

    document.getElementById("mainImg").src = "images/product1.jpg";
}

function goHome(){
    document.getElementById("product").classList.add("hidden");
    document.getElementById("home").style.display = "block";
}

function setColor(color){

    // kalau kamu belum punya file varian, tetap fallback ke product utama
    document.getElementById("mainImg").src = "images/" + color + ".jpg";
}

</script>

</body>
</html>
