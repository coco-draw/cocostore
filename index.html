<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>COCO STORE</title>
<link rel="stylesheet" href="style.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<!-- ================= HOME ================= -->
<div id="home">

    <div class="banner-wrapper">
        <img src="images/banner.jpg" class="banner">

        <!-- PRODUK 1 -->
        <div class="hotspot p1" onclick="openProduct('bag')"></div>

        <!-- PRODUK 2 -->
        <div class="hotspot p2" onclick="openProduct('shoe')"></div>

        <!-- KERANJANG -->
        <a class="hotspot cart"
           href="https://shopee.co.id/cocodraw?categoryId=100535&entryPoint=ShopByPDP&itemId=48709530040"
           target="_blank"></a>

        <!-- WA -->
        <a class="hotspot wa-area"
           href="https://api.whatsapp.com/send/?phone=6285363892602&text&type=phone_number&app_absent=0"
           target="_blank"></a>

    </div>

</div>

<!-- ================= PRODUCT PAGE ================= -->
<div id="productPage" class="page hidden">

    <button class="back" onclick="goHome()">← BACK</button>

    <img id="mainImg" class="big">

    <div class="colors">
        <button onclick="setColor('black')">Black</button>
        <button onclick="setColor('purple')">Purple</button>
        <button onclick="setColor('gold')">Gold</button>
        <button onclick="setColor('silver')">Silver</button>
    </div>

    <a class="buy"
       href="https://shopee.co.id/cocodraw?categoryId=100535&entryPoint=ShopByPDP&itemId=48709530040"
       target="_blank">
       BUY ON SHOPEE
    </a>

</div>

<script>

function openProduct(type){

    document.getElementById("home").style.display = "none";
    document.getElementById("productPage").classList.remove("hidden");

    document.getElementById("mainImg").src = "images/black.jpg";
}

function goHome(){
    document.getElementById("productPage").classList.add("hidden");
    document.getElementById("home").style.display = "block";
}

function setColor(color){
    document.getElementById("mainImg").src = "images/" + color + ".jpg";
}

</script>

</body>
</html>
