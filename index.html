<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>COCO STORE</title>
<link rel="stylesheet" href="style.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<!-- ================= HOME (BANNER + PRODUCTS) ================= -->
<div id="home">

    <img src="images/banner.jpg" class="banner">

    <!-- BUY BUTTON DI BANNER -->
    <a class="buy-banner"
       href="https://shopee.co.id/cocodraw?categoryId=100535&entryPoint=ShopByPDP&itemId=48709530040"
       target="_blank">
       BUY ON SHOPEE
    </a>

    <h3>Products</h3>

    <div class="grid">

        <img src="images/product1.jpg" onclick="openProduct('p1')">
        <img src="images/product2.jpg" onclick="openProduct('p2')">
        <img src="images/product3.jpg" onclick="openProduct('p3')">
        <img src="images/product4.jpg" onclick="openProduct('p4')">

    </div>

</div>

<!-- ================= DETAIL VIEW ================= -->
<div id="detail" class="hidden">

    <img id="mainImg" class="detail-img">

    <p id="title"></p>

    <!-- COLOR VARIANT -->
    <div class="colors">

        <button onclick="changeImg('images/black.jpg')">Black</button>
        <button onclick="changeImg('images/purple.jpg')">Purple</button>
        <button onclick="changeImg('images/gold.jpg')">Gold</button>
        <button onclick="changeImg('images/silver.jpg')">Silver</button>

    </div>

    <button class="back" onclick="goHome()">← BACK</button>

    <a class="buy"
       href="https://shopee.co.id/cocodraw?categoryId=100535&entryPoint=ShopByPDP&itemId=48709530040"
       target="_blank">
       BUY ON SHOPEE
    </a>

</div>

<!-- WHATSAPP ICON -->
<a class="wa"
   href="https://api.whatsapp.com/send/?phone=6285363892602&text&type=phone_number&app_absent=0"
   target="_blank">
💬
</a>

<script>
function openProduct(id){

    document.getElementById("home").style.display = "none";
    document.getElementById("detail").classList.remove("hidden");

    if(id === "p1"){
        document.getElementById("mainImg").src = "images/black.jpg";
        document.getElementById("title").innerText = "COCO BAG";
    }

    if(id === "p2"){
        document.getElementById("mainImg").src = "images/product2.jpg";
        document.getElementById("title").innerText = "COCO SHOES";
    }

    if(id === "p3"){
        document.getElementById("mainImg").src = "images/product3.jpg";
        document.getElementById("title").innerText = "COCO WATCH";
    }

    if(id === "p4"){
        document.getElementById("mainImg").src = "images/product4.jpg";
        document.getElementById("title").innerText = "COCO GLASSES";
    }
}

function goHome(){
    document.getElementById("home").style.display = "block";
    document.getElementById("detail").classList.add("hidden");
}

function changeImg(img){
    document.getElementById("mainImg").src = img;
}
</script>

</body>
</html>
